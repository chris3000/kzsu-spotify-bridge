# Litestream config. BUCKET_NAME / AWS_* env vars are set automatically by
# `fly storage create` (Tigris); AWS creds are picked up from the environment.
dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - type: s3
        bucket: ${BUCKET_NAME}
        path: kzsu.db
        endpoint: ${AWS_ENDPOINT_URL_S3}
        region: ${AWS_REGION}
        sync-interval: 10s
        retention: 72h
        snapshot-interval: 24h
